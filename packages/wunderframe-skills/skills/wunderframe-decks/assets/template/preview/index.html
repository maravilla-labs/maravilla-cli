<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Deck preview — Wunderframe screen + remote</title>
		<style>
			:root { --bg: #0e0f12; --panel: #17191e; --line: #2a2d35; --ink: #eceef2; --muted: #9298a5; --accent: #5ee0c2; --warn: #ffb547; --bad: #ff6b6b; }
			* { box-sizing: border-box; }
			html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
			body { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
			header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
			header b { font-weight: 600; }
			.chip { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
			.chip.ok { color: var(--accent); border-color: var(--accent); }
			.chip.warn { color: var(--warn); border-color: var(--warn); }
			.screen { display: grid; place-items: center; padding: 16px; min-height: 0; }
			.box { position: relative; width: min(100%, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); }
			.box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
			aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
			.pos { padding: 16px; border-bottom: 1px solid var(--line); }
			.pos .n { font-size: 28px; font-weight: 700; }
			.pos .t { color: var(--muted); margin-top: 2px; }
			.pos .step { color: var(--accent); font-size: 13px; margin-top: 4px; min-height: 1em; }
			.btns { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
			.btns .row { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
			button { font: inherit; color: var(--ink); background: #22252c; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
			button:hover { border-color: var(--muted); }
			button.big { padding: 18px; font-size: 16px; font-weight: 600; }
			button.next { background: var(--accent); color: #062019; border-color: var(--accent); }
			button[aria-pressed='false'] { color: var(--muted); }
			.notes { flex: 1; overflow: auto; padding: 16px; font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
			.notes:empty::before { content: 'No notes on this slide.'; color: var(--muted); font-size: 14px; }
			.issues { max-height: 30%; overflow: auto; border-top: 1px solid var(--line); padding: 8px 16px; font-size: 12px; }
			.issues:empty { display: none; }
			.issues div { color: var(--bad); word-break: break-all; }
			.issues div.info { color: var(--muted); }
			#grid { position: fixed; inset: 0; background: rgba(8, 9, 11, 0.96); overflow: auto; padding: 24px; display: none; z-index: 5; }
			#grid.open { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; align-content: start; }
			.thumb { cursor: pointer; }
			.thumb .frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 2px solid var(--line); border-radius: 6px; background: #000; }
			.thumb.on .frame { border-color: var(--accent); }
			.thumb iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
			.thumb span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
			kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
		</style>
	</head>
	<body>
		<header>
			<b>Deck preview</b>
			<span class="chip" id="mode"></span>
			<span class="chip" id="conn">waiting for the deck…</span>
			<span style="flex: 1"></span>
			<span class="chip"><kbd>→</kbd> <kbd>Space</kbd> next · <kbd>←</kbd> back · <kbd>G</kbd> slides · <kbd>R</kbd> reload screen</span>
		</header>
		<div class="screen"><div class="box" id="box"></div></div>
		<aside>
			<div class="pos">
				<div class="n" id="num">–</div>
				<div class="t" id="title"></div>
				<div class="step" id="step"></div>
			</div>
			<div class="btns">
				<button class="big" id="prev">Back</button>
				<button class="big next" id="next">Next</button>
				<div class="row">
					<button id="first">First</button>
					<button id="last">Last</button>
					<button id="gridBtn">Slides</button>
					<button id="sound" aria-pressed="true">Sound on</button>
					<button id="reload" title="Like a screen restarting mid-talk: the remote puts it back">Reload screen</button>
				</div>
			</div>
			<div class="notes" id="notes"></div>
			<div class="issues" id="issues"></div>
		</aside>
		<div id="grid"></div>
		<script type="module" src="./harness.js"></script>
	</body>
</html>
